name: Build dependency image

on:
  workflow_call:
    outputs:
      image:
        description: Dependency image reference
        value: ${{ jobs.build-deps-image.outputs.image }}

jobs:
  build-deps-image:
    name: Build dependency image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.deps.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # No credential left in `.git/config` after the fetch; `origin` stays clean.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Publish deps image
        id: deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./workflow.cmd container.publish
          echo "image=$(cat .deps-image)" >> "$GITHUB_OUTPUT"

      - name: Minimize uv cache
        run: uv cache prune --ci
