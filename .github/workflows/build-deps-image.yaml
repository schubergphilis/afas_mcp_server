name: Build dependency image

on:
  workflow_call:
    outputs:
      image:
        description: Dependency image reference
        value: ${{ jobs.build-deps-image.outputs.image }}

jobs:
  build-deps-image:
    name: Build dependency image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.deps.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No credential left in `.git/config` after the fetch; `origin` stays clean.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Publish deps image
        id: deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./workflow.cmd container.publish
          echo "image=$(cat .deps-image)" >> "$GITHUB_OUTPUT"

      - name: Minimize uv cache
        run: uv cache prune --ci
