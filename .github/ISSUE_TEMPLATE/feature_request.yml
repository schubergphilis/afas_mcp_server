name: Feature request
description: Something the server should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get an assistant to do with AFAS, and where does the server fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The tool, parameter or behaviour you have in mind. Sketch the call and the result if you can.
  - type: textarea
    id: afas-api
    attributes:
      label: AFAS API involved
      description: Which REST endpoint, connector type or documented AFAS behaviour this relies on. Links to help.afas.nl are welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require writing to AFAS without `AFAS_ALLOW_WRITES=true`
        - label: This does not bundle a connector catalogue or field list into the server
