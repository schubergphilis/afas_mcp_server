# `pre-commit install` installs every type listed here, so the pre-push hook below is
# wired up by the same bootstrap step as the rest.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: lint-commit
        name: Lint commit message
        description: "Example: feat: added new feature"
        entry: sh -c './workflow.cmd lint.commitizen --commit-msg-file="$1"' --
        language: system
        pass_filenames: true
        stages: [commit-msg]
      # The per-file tools below receive only the staged files, so a one-line change costs a
      # one-file check instead of a whole-project sweep. `sh -c … --` collapses the file list
      # pre-commit appends into the single `--paths` value Invoke expects; Invoke would
      # otherwise read the second filename as another task name and fail. (Filenames
      # containing spaces are not supported by that marshalling — as with `lint-commit`.)
      - id: format
        name: Format code and sort imports
        entry: sh -c './workflow.cmd format --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      - id: ruff
        name: Lint with ruff
        entry: sh -c './workflow.cmd lint.ruff --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      - id: pylint
        name: Lint with pylint
        entry: sh -c './workflow.cmd lint.pylint --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      - id: complexipy
        name: Complexity check with complexipy
        entry: sh -c './workflow.cmd lint.complexipy --paths="$*"' --
        language: system
        pass_filenames: true
        files: ^(src/).*\.py$
        stages: [pre-commit]
      # ty stays whole-project. Type checking is whole-program: a signature change surfaces
      # as an error in the *callers*, so handing it only the changed files would hide the
      # errors that matter most. It is fast enough that scoping buys little anyway.
      - id: ty
        name: Type check with ty
        entry: ./workflow.cmd lint.ty
        language: system
        pass_filenames: false
        files: ^(_CI/tasks/|src/|tests/).*\.py$
        stages: [pre-commit]
      # pyscn stays whole-project too: it reports dead code and duplicate blocks, both of
      # which are relationships *between* files. A single-file view cannot see either — a
      # function only looks dead once you know nothing else calls it.
      - id: pyscn
        name: Quality check with pyscn
        entry: ./workflow.cmd quality.pyscn-check
        language: system
        pass_filenames: false
        files: ^(src/).*\.py$
        stages: [pre-commit]
      # Pre-push, not pre-commit, and `test.pytest` rather than the `test` aggregator.
      #
      # The aggregator also updates the README coverage badge and ratchets `fail_under` in
      # pyproject.toml. Doing that from a commit hook meant pre-commit aborted the commit
      # with "files were modified by this hook" — after the commit message was already
      # written — for files the author had not staged. Those writes belong to a deliberate
      # `./workflow.cmd test`, where the bump can be reviewed and committed on purpose.
      #
      # Running the whole suite on every commit was the other half of the problem: slow
      # enough to teach people `--no-verify`, which switches off every hook here. On
      # pre-push it still blocks anything broken from reaching the remote, without
      # standing between the author and each commit.
      - id: test
        name: Run tests
        entry: ./workflow.cmd test.pytest
        language: system
        pass_filenames: false
        files: ^(src/|tests/).*\.py$
        stages: [pre-push]
      - id: security-overrides
        name: Validate .security-overrides
        entry: ./workflow.cmd secure.validate-overrides
        language: system
        pass_filenames: false
        files: ^\.security-overrides$
        stages: [pre-commit]
